<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .stage {
            position: relative;
            width: 360px;
            height: 240px;
        }

        .main-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid #ff0000;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.3);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transform: scale(0.85);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1;
        }

        .main-card.visible {
            opacity: 1;
            transform: scale(1);
        }

        .main-card h1 {
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .cover-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .cover-container.disabled {
            pointer-events: none;
        }

        .cover-half {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.1, 0.8, 0.1, 1), opacity 0.5s ease;
        }

        .card-content {
            width: 100%;
            height: 100%;
            background: #080808;
            border: 1px solid #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .top-half {
            clip-path: polygon(0 0, 100% 0, 100% 42%, 0 58%);
        }

        .bottom-half {
            clip-path: polygon(0 58%, 100% 42%, 100% 100%, 0 100%);
        }

        .top-half.cut {
            transform: translate(-140px, -120px) rotate(-15deg);
            opacity: 0;
        }

        .bottom-half.cut {
            transform: translate(140px, 120px) rotate(15deg);
            opacity: 0;
        }

        .slash-line {
            position: absolute;
            top: 50%;
            left: -20%;
            width: 140%;
            height: 4px;
            background: #ffffff;
            box-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 40px #ff0000;
            transform: translateY(-50%) rotate(-9deg) scaleX(0);
            transform-origin: left center;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
        }

        .slash-line.active {
            animation: slashAnim 0.3s ease-out forwards;
        }

        @keyframes slashAnim {
            0% {
                opacity: 1;
                transform: translateY(-50%) rotate(-9deg) scaleX(0);
            }
            50% {
                opacity: 1;
                transform: translateY(-50%) rotate(-9deg) scaleX(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-50%) rotate(-9deg) scaleX(1);
            }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .open-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ff0000;
            border-radius: 10px;
            padding: 10px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
        }

        .open-btn:hover {
            background: #ff0000;
            color: #000000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="main-card" id="mainCard">
            <h1>Iris</h1>
            <p class="subtitle">make a name for yourself</p>
        </div>

        <div class="cover-container" id="coverContainer">
            <div class="slash-line" id="slashLine"></div>
            
            <div class="cover-half top-half" id="topHalf">
                <div class="card-content">
                    <p class="subtitle">make a name for yourself</p>
                    <button class="open-btn" id="openBtn">O̸P̸E̸N̸</button>
                </div>
            </div>

            <div class="cover-half bottom-half" id="bottomHalf">
                <div class="card-content">
                    <p class="subtitle">make a name for yourself</p>
                    <button class="open-btn">O̸P̸E̸N̸</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const coverContainer = document.getElementById('coverContainer');
        const topHalf = document.getElementById('topHalf');
        const bottomHalf = document.getElementById('bottomHalf');
        const slashLine = document.getElementById('slashLine');
        const mainCard = document.getElementById('mainCard');

        coverContainer.addEventListener('click', () => {
            coverContainer.classList.add('disabled');
            slashLine.classList.add('active');

            setTimeout(() => {
                topHalf.classList.add('cut');
                bottomHalf.classList.add('cut');
            }, 150);

            setTimeout(() => {
                mainCard.classList.add('visible');
            }, 300);
        });
    </script>
</body>
</html>
