<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }

        .main-card {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid #ff0000;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.3);
            border-radius: 20px;
            padding: 40px 60px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 400px;
            width: 90%;
        }

        .main-card h1 {
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .main-card p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .cover-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
        }

        .cover-half {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.7s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.7s ease;
        }

        .left-half {
            clip-path: inset(0 50% 0 0);
        }

        .right-half {
            clip-path: inset(0 0 0 50%);
        }

        .left-half.cut {
            transform: translateX(-100%);
            opacity: 0;
        }

        .right-half.cut {
            transform: translateX(100%);
            opacity: 0;
        }

        .cover-card {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
            border-radius: 20px;
            padding: 40px 50px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 380px;
            width: 90%;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .open-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ff0000;
            border-radius: 10px;
            padding: 10px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
        }

        .open-btn:hover {
            background: #ff0000;
            color: #000000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
        }

        .slash-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 3px;
            height: 100%;
            background: #ffffff;
            box-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 40px #ff0000;
            transform: translateX(-50%) scaleY(0);
            transform-origin: center;
            z-index: 101;
            pointer-events: none;
            opacity: 0;
        }

        .slash-line.active {
            animation: slashAnim 0.25s ease-out forwards;
        }

        @keyframes slashAnim {
            0% {
                opacity: 1;
                transform: translateX(-50%) scaleY(0);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scaleY(1);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) scaleY(1);
            }
        }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="main-card">
            <h1>Iris</h1>
            <p>make a name for yourself</p>
        </div>
    </div>

    <div class="cover-container" id="coverContainer">
        <div class="slash-line" id="slashLine"></div>

        <div class="cover-half left-half" id="leftHalf">
            <div class="cover-card">
                <p class="subtitle">make a name for yourself</p>
                <button class="open-btn">O̸P̸E̸N̸</button>
            </div>
        </div>

        <div class="cover-half right-half" id="rightHalf">
            <div class="cover-card">
                <p class="subtitle">make a name for yourself</p>
                <button class="open-btn">O̸P̸E̸N̸</button>
            </div>
        </div>
    </div>

    <script>
        const leftHalf = document.getElementById('leftHalf');
        const rightHalf = document.getElementById('rightHalf');
        const slashLine = document.getElementById('slashLine');
        const coverContainer = document.getElementById('coverContainer');
        const openBtns = document.querySelectorAll('.open-btn');

        openBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                slashLine.classList.add('active');

                setTimeout(() => {
                    leftHalf.classList.add('cut');
                    rightHalf.classList.add('cut');
                }, 120);

                setTimeout(() => {
                    coverContainer.style.display = 'none';
                }, 800);
            });
        });
    </script>
</body>
</html>
