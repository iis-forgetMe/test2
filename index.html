<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
            border-radius: 20px;
            padding: 40px 50px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 380px;
            width: 90%;
        }

        .card h1 {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .open-btn {
            margin-top: 10px;
            background: transparent;
            color: #ffffff;
            border: 1px solid #ff0000;
            border-radius: 10px;
            padding: 10px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
        }

        .open-btn:hover {
            background: #ff0000;
            color: #000000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Iris</h1>
        <p class="subtitle">make a name for yourself</p>
        <button class="open-btn">O̸P̸E̸N̸</button>
    </div>
</body>
</html>
